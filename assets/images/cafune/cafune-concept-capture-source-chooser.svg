<svg viewBox="0 0 390 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ttl dsc">
<title id="ttl">Cafune capture — photo source chooser</title>
<desc id="dsc">On the head-map capture step, tapping a region opens a bottom sheet titled Add Front hairline with two choices: Take photo (use the camera now) and Upload from device (choose an existing photo). A note states that either way the app checks photo quality before accepting. Cancel closes the sheet.</desc>
<defs>
<style>
text{font-family:Inter,system-ui,sans-serif}
.brand{font:700 18px Inter}
.small{font:500 11px Inter;fill:#5f6b69}
.step{font:700 11px Inter;fill:#0e7c7b;letter-spacing:1.5px}
.h1{font:700 22px Inter;fill:#14201f}
.sheetttl{font:700 18px Inter;fill:#14201f}
.opt{font:600 15px Inter;fill:#14201f}
.optsub{font:400 12.5px Inter;fill:#5f6b69}
.note{font:400 12.5px Inter;fill:#5f6b69}
.cancel{font:600 15px Inter;fill:#0e7c7b}
</style>
</defs>

<rect x="0" y="0" width="390" height="720" fill="#eceeed"/>
<rect x="0" y="0" width="390" height="56" fill="#ffffff"/>
<path d="M28,22 l-8,6 l8,6" fill="none" stroke="#14201f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="195" y="34" text-anchor="middle" class="brand"><tspan fill="#14201f">Ca</tspan><tspan fill="#0e7c7b">fune</tspan></text>
<rect x="300" y="18" width="74" height="22" rx="11" fill="#ffffff" stroke="#d3d7d5"/>
<text x="337" y="33" text-anchor="middle" class="small">non-medical</text>
<rect x="0" y="56" width="390" height="3" fill="#e6e8e7"/><rect x="0" y="56" width="195" height="3" fill="#0e7c7b"/>

<text x="20" y="88" class="step">STEP 2 OF 4</text>
<text x="20" y="116" class="h1">Capture scalp</text>
<ellipse cx="195" cy="210" rx="60" ry="74" fill="#f4f4f3" stroke="#d3d7d5" stroke-width="1.5"/>
<circle cx="195" cy="168" r="11" fill="#0e7c7b"/>
<circle cx="195" cy="210" r="11" fill="#fff" stroke="#0e7c7b" stroke-width="2"/>
<circle cx="195" cy="252" r="11" fill="#f4f4f3" stroke="#d3d7d5"/>
<circle cx="160" cy="212" r="11" fill="#f4f4f3" stroke="#d3d7d5"/>
<circle cx="230" cy="212" r="11" fill="#f4f4f3" stroke="#d3d7d5"/>

<rect x="0" y="59" width="390" height="661" fill="#0f1a19" opacity="0.42"/>

<path d="M0,388 q0,-16 16,-16 h358 q16,0 16,16 v332 h-390 z" fill="#ffffff"/>
<rect x="167" y="384" width="56" height="5" rx="2.5" fill="#d3d7d5"/>
<text x="24" y="428" class="sheetttl">Add Front · hairline</text>

<rect x="24" y="448" width="342" height="74" rx="12" fill="#ffffff" stroke="#e6e8e7"/>
<circle cx="64" cy="485" r="20" fill="#e6f2f1"/>
<rect x="53" y="479" width="22" height="15" rx="3.5" fill="none" stroke="#0e7c7b" stroke-width="2"/>
<circle cx="64" cy="486.5" r="4.5" fill="none" stroke="#0e7c7b" stroke-width="2"/>
<rect x="60" y="476" width="8" height="3" rx="1.5" fill="#0e7c7b"/>
<text x="98" y="480" class="opt">Take photo</text>
<text x="98" y="499" class="optsub">Use your camera now</text>
<path d="M344,478 l7,7 l-7,7" fill="none" stroke="#9aa4a2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

<rect x="24" y="532" width="342" height="74" rx="12" fill="#ffffff" stroke="#e6e8e7"/>
<circle cx="64" cy="569" r="20" fill="#e6f2f1"/>
<rect x="53" y="561" width="22" height="16" rx="3" fill="none" stroke="#0e7c7b" stroke-width="2"/>
<circle cx="59.5" cy="566.5" r="2.4" fill="#0e7c7b"/>
<path d="M56,577 l6,-6 l5,4 l4,-5 l4,7 z" fill="#0e7c7b"/>
<text x="98" y="564" class="opt">Upload from device</text>
<text x="98" y="583" class="optsub">Choose an existing photo</text>
<path d="M344,562 l7,7 l-7,7" fill="none" stroke="#9aa4a2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

<text x="195" y="642" text-anchor="middle" class="note">Either way, Cafune checks photo quality before accepting.</text>
<text x="195" y="686" text-anchor="middle" class="cancel">Cancel</text>
</svg>
