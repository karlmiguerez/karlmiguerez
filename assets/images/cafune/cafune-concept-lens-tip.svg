<text x="189" y="352" text-anchor="middle" class="cap">clip-on macro lens · optional</text>

<text x="24" y="410" class="h1">A clip-on macro lens (optional)</text>
<text x="24" y="440" class="body">For sharper close-ups, you can attach a clip-on</text>
<text x="24" y="460" class="body">macro (magnifier) lens over your phone camera</text>
<text x="24" y="480" class="body">before capturing your scalp.</text>

<text x="24" y="516" class="note">It's completely optional — Cafune works fine without</text>
<text x="24" y="534" class="note">one, and we don't sell or endorse any specific lens.</text>
<text x="24" y="552" class="note">Whether to use one is up to you.</text>

