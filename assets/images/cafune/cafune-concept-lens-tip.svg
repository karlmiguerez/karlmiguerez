<title id="ttl">Cafune onboarding — optional clip-on macro lens tip</title>
<desc id="dsc">Onboarding slide illustrating an optional clip-on macro lens that attaches over the phone camera for sharper scalp close-ups. Copy states it is optional, that Cafune does not sell or endorse any specific lens, and that using one is up to the user. Primary button Got it, with Skip for now.</desc>
